<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Décibel - Sélection du Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --text-main: #f8fafc;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        h1 {
            font-size: 3rem; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { font-size: 1.2rem; color: #94a3b8; margin-bottom: 40px; text-align: center; }

        .mode-container {
            display: grid; gap: 20px; width: 90%; max-width: 400px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 20px;
            text-align: center; text-decoration: none; color: white;
            font-size: 1.5rem; font-weight: 700;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--primary);
        }

        .disabled {
            opacity: 0.5; cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Décibel</h1>
    <p>Choisissez votre mode de jeu</p>

    <div class="mode-container">
        <!-- Lien vers le scanner avec le paramètre mode=music -->
        <a href="webapp/scanner.html?mode=music" class="mode-btn">🎵 Mode Musique</a>
        
        <!-- Futurs modes désactivés pour l'instant -->
        <a href="#" class="mode-btn disabled">🎬 Mode Films (Bientôt)</a>
        <a href="#" class="mode-btn disabled">📺 Mode Séries (Bientôt)</a>
    </div>
</body>
</html>
